name: Addon checks
description: Check Lua 5.1 syntax, buff alternatives, and update automation
runs:
  using: composite
  steps:
    - shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y lua5.1 jq
    - shell: bash
      run: |
        {
          luac5.1 -p BetterForeverCooldowns/BetterForeverCooldowns.lua
          luac5.1 -p BetterForeverCooldowns/Options.lua
          lua5.1 .github/tests/buff-alternatives.lua
          lua5.1 .github/tests/cooldown-only.lua
          lua5.1 .github/tests/compatibility.lua
          lua5.1 .github/tests/startup.lua
          bash .github/tests/update.sh
        } 2>&1 | tee test-results.txt
